<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Loan Advisor</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-robot"></i>
                    <h1>AI Loan Advisor</h1>
                </div>
                <div class="user-badge">
                    <i class="fas fa-user-circle"></i>
                    <span>demo_user</span>
                </div>
            </div>
            <p class="tagline">Get personalised loan recommendations in seconds</p>
            <div class="login-area">
                <input type="text" id="username-input" placeholder="Enter username" value="demo_user" />
                <button id="login-btn">Login</button>
            </div>
        </header>
        <main>
            <div id="chat-container">
                <div id="messages"></div>
                <div id="input-area">
                    <input type="text" id="user-input" placeholder="Ask about loan products, EMIs, tenure..." />
                    <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </main>
        <footer>
            <small>Final approval subject to underwriting.</small>
        </footer>
    </div>

    <!-- Profile Modal -->
    <div id="profile-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-user-edit"></i> Your Loan Profile</h2>
                <p>Please fill in your details to get personalized recommendations</p>
            </div>
            <form id="profile-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Loan Amount (₹)</label>
                        <input type="number" id="amount" value="200000" required />
                    </div>
                    <div class="form-group">
                        <label>Purpose</label>
                        <select id="purpose" required>
                            <option value="vacation">Vacation</option>
                            <option value="business">Business</option>
                            <option value="education">Education</option>
                            <option value="medical">Medical</option>
                            <option value="home">Home Improvement</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Monthly Income (₹)</label>
                        <input type="number" id="monthly_income" value="60000" required />
                    </div>
                    <div class="form-group">
                        <label>Existing EMI (₹)</label>
                        <input type="number" id="existing_emi" value="0" />
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Preferred Tenure (months)</label>
                        <input type="number" id="tenure" value="24" required />
                    </div>
                    <div class="form-group">
                        <label>Employment Type</label>
                        <select id="employment_type" required>
                            <option value="salaried">Salaried</option>
                            <option value="self-employed">Self-Employed</option>
                            <option value="business">Business Owner</option>
                            <option value="freelancer">Freelancer</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Risk Profile</label>
                        <select id="risk_profile" required>
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Business Income (₹) <small>(if applicable)</small></label>
                        <input type="number" id="business_income" value="0" />
                    </div>
                </div>
                <button type="submit" class="submit-btn">
                    <i class="fas fa-check-circle"></i> Continue to Chat
                </button>
            </form>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
